[workspace]
members = ["crates/atv-core", "crates/atv-tools", "crates/atv-net", "crates/atv-relay", "crates/atv-content", "crates/atv-game", "crates/atv-render", "crates/atv-app", "crates/atv-ui"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.3.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.release]
lto = true
opt-level = "s"
