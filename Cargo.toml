[workspace]
members = ["crates/atv-core", "crates/atv-web", "crates/atv-tools"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.release]
lto = true
opt-level = "s"
