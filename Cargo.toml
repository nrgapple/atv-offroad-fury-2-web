[workspace]
members = ["crates/atv-core", "crates/atv-tools", "crates/atv-net", "crates/atv-relay", "crates/atv-server", "crates/atv-content", "crates/atv-game", "crates/atv-render", "crates/atv-app", "crates/atv-ui"]
resolver = "2"
# Vendored, patched dependencies (see third_party/README.md); not members.
exclude = ["third_party/winit"]

[workspace.package]
edition = "2024"
version = "0.3.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.8"

[profile.release]
lto = true
opt-level = "s"

# fury-server is a long-running service: optimise it for speed, not size.
[profile.release.package.atv-server]
opt-level = 3

# winit 0.30.13 with Android gamepad input (third_party/README.md).
[patch.crates-io]
winit = { path = "third_party/winit" }
