name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed files
        id: plan
        run: python3 tools/ci_changes.py
      - name: Validate documentation, metadata and repository hygiene
        timeout-minutes: 5
        run: |
          python3 tools/verify_repository.py
          python3 tools/ci_changes.py --validate
          python3 tools/check_secrets.py --history
          python3 -m unittest discover -s tools -p 'test_devlog.py'
          python3 -m unittest discover -s tools -p 'test_ci_changes.py'
          python3 -m unittest discover -s tools -p 'test_release_workflow.py'
      - name: Reuse checked application for dev-log publication
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANE: ${{ steps.plan.outputs.lane }}
        run: python3 tools/reuse_site_release.py --lane "$RELEASE_LANE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.prepare.outputs.build == 'true'
        with:
          node-version: '24'
      - name: Install Rust toolchain
        if: steps.prepare.outputs.build == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Identify Rust application cache
        if: steps.prepare.outputs.build == 'true'
        id: rust-key
        run: |
          python3 tools/worker_build_cache.py key
      - name: Restore trusted Rust compilation and registry cache
        if: steps.prepare.outputs.build == 'true'
        id: rust-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: fury-rust-v1-${{ steps.rust-key.outputs.key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            fury-rust-v1-${{ steps.rust-key.outputs.key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-
      # Bounded so a hung test fails with its name in the log instead of stalling
      # the deployment until someone cancels it. Warm runs take about two minutes.
      - name: Check repository and implementation
        if: steps.prepare.outputs.build == 'true'
        timeout-minutes: 12
        run: |
          python3 -m unittest discover -s tools -p 'test_security.py'
          make check CARGO="$(which cargo)"
          python3 -m unittest discover -s tools -p 'test_release*.py'
          node --test cloudflare/*.test.mjs
      - name: Identify pinned deployment tool cache
        if: steps.prepare.outputs.build == 'true'
        id: worker-build-key
        run: python3 tools/worker_build_cache.py key
      - name: Restore pinned deployment tool
        if: steps.prepare.outputs.build == 'true'
        id: worker-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/fury-worker-build/bin/worker-build
            ${{ runner.temp }}/fury-worker-build/identity.json
          key: ${{ steps.worker-build-key.outputs.key }}
      - name: Validate or install pinned Rust Worker build tool
        if: steps.prepare.outputs.build == 'true'
        id: worker-build-tool
        env:
          WORKER_BUILD_CACHE_HIT: ${{ steps.worker-build-cache.outputs.cache-hit }}
        run: |
          python3 tools/worker_build_cache.py prepare --root "$RUNNER_TEMP/fury-worker-build" --cache-hit "$WORKER_BUILD_CACHE_HIT"
          install -m 755 "$RUNNER_TEMP/fury-worker-build/bin/worker-build" "$HOME/.cargo/bin/worker-build"
      - name: Build browser release
        if: steps.prepare.outputs.build == 'true'
        timeout-minutes: 12
        run: |
          make web
          make relay
          python3 tools/package_release.py --commit "$GITHUB_SHA"
      - name: Upload asset-free release
        if: steps.plan.outputs.publish == 'true' && github.event_name != 'pull_request' || steps.prepare.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release
          path: work/release/
          if-no-files-found: error
          retention-days: 14
      - name: Save validated deployment tool for future builds
        continue-on-error: true
        if: >-
          success() && steps.prepare.outputs.build == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.worker-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/fury-worker-build/bin/worker-build
            ${{ runner.temp }}/fury-worker-build/identity.json
          key: ${{ steps.worker-build-key.outputs.key }}
      - name: Save trusted Rust application cache
        continue-on-error: true
        if: >-
          success() && steps.prepare.outputs.build == 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            target
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: fury-rust-v1-${{ steps.rust-key.outputs.key }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
      - name: Record selected validation and publication lane
        if: always()
        env:
          RELEASE_LANE: ${{ steps.plan.outputs.lane }}
          RUNTIME_BUILD: ${{ steps.prepare.outputs.build }}
          REUSED_APPLICATION: ${{ steps.prepare.outputs.reused }}
        run: |
          echo "Lane: $RELEASE_LANE; Rust build: $RUNTIME_BUILD; reused checked application: $REUSED_APPLICATION" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain how to retry a failed main build
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          echo "Main build failed or timed out. Fix forward, or retry this run's failed jobs with: \`gh run rerun $GITHUB_RUN_ID --failed\`. Production deploys only from Actions." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    name: Deploy and verify production
    needs: web
    if: vars.FURY_DEPLOYMENT_MODE != 'local' && needs.web.outputs.publish == 'true' && github.repository == 'nrgapple/atv-offroad-fury-2-web' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://furyremastered.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download checked release from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-release
          path: work/release/
      - name: Reject delayed or already deployed builds
        id: deployment-gate
        env:
          GH_TOKEN: ${{ github.token }}
          FURY_DEPLOYMENT_MODE: ${{ vars.FURY_DEPLOYMENT_MODE }}
        run: python3 tools/deployment_gate.py --commit "$GITHUB_SHA"
      - name: Deploy successful main build to Cloudflare
        if: steps.deployment-gate.outputs.publish == 'true'
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare deployment requires the scoped CLOUDFLARE_API_TOKEN repository secret.'
            exit 1
          fi
          python3 tools/stage_cloudflare.py --release work/release --commit "$GITHUB_SHA" --preserve-custom-domains
          npx --yes wrangler@4.149.0 deploy --config work/cloudflare/wrangler.jsonc
      - name: Verify public commit, application hashes and dev log
        if: steps.deployment-gate.outputs.publish == 'true'
        timeout-minutes: 4
        run: |
          python3 tools/verify_ci_deployment.py --release work/release --commit "$GITHUB_SHA" \
            --url https://furyremastered.com/
          python3 tools/verify_ci_deployment.py --release work/release --commit "$GITHUB_SHA" \
            --url https://atv-offroad-fury-2.champtoday.workers.dev/
      - name: Record deployment links and result
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Production deployment: $DEPLOYMENT_RESULT"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "[Public HTTPS game](https://furyremastered.com/) · [Screenshot dev log](https://furyremastered.com/devlog.html)"
            echo ""
            echo "[GitHub deployment history](https://github.com/$GITHUB_REPOSITORY/deployments) · [This Actions run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            echo "Success requires public commit identity, all authored application hashes, and committed dev-log text to match this run's checked artifact."
            echo "Runtime content and screenshot images are maintained separately in R2; full gameplay checks remain local/public browser checkpoints."
          } >> "$GITHUB_STEP_SUMMARY"
