name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check source exclusions and release rejection tests
        run: |
          python3 tools/verify_repository.py
          python3 -m py_compile tools/*.py
          python3 -m unittest discover -s tools -p 'test_release*.py'
          node --test cloudflare/worker.test.mjs web/input.test.mjs web/content.test.mjs web/touch.test.mjs web/bindings.test.mjs web/music.test.mjs web/audio.test.mjs web/diagnostics.test.mjs web/multiplayer.test.mjs
      - name: Explain production ownership
        run: |
          echo 'The local Rust atv-release queue checks, builds and deploys exact committed checkpoints with their separate R2 dependencies. This workflow does not build WASM, upload resources or deploy production.' >> "$GITHUB_STEP_SUMMARY"
