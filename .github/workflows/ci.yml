name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - name: Check repository and implementation
        run: |
          python3 tools/verify_repository.py
          make check CARGO="$(which cargo)"
          python3 -m unittest discover -s tools -p 'test_release*.py'
          node --test cloudflare/worker.test.mjs
      - name: Identify pinned deployment tool cache
        id: worker-build-key
        run: python3 tools/worker_build_cache.py key
      - name: Restore pinned deployment tool
        id: worker-build-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/fury-worker-build/bin/worker-build
            ${{ runner.temp }}/fury-worker-build/identity.json
          key: ${{ steps.worker-build-key.outputs.key }}
      - name: Validate or install pinned Rust Worker build tool
        id: worker-build-tool
        env:
          WORKER_BUILD_CACHE_HIT: ${{ steps.worker-build-cache.outputs.cache-hit }}
        run: |
          python3 tools/worker_build_cache.py prepare --root "$RUNNER_TEMP/fury-worker-build" --cache-hit "$WORKER_BUILD_CACHE_HIT"
          install -m 755 "$RUNNER_TEMP/fury-worker-build/bin/worker-build" "$HOME/.cargo/bin/worker-build"
      - name: Build browser release
        run: |
          make web
          make relay
          python3 tools/package_release.py --commit "$GITHUB_SHA"
      - name: Upload asset-free release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-release
          path: work/release/
          if-no-files-found: error
          retention-days: 14
      - name: Save validated deployment tool for future builds
        continue-on-error: true
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          steps.worker-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ runner.temp }}/fury-worker-build/bin/worker-build
            ${{ runner.temp }}/fury-worker-build/identity.json
          key: ${{ steps.worker-build-key.outputs.key }}
  deploy:
    name: Deploy and verify production
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://furyremastered.com/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Download checked release from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-release
          path: work/release/
      - name: Deploy successful main build to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare deployment requires the scoped CLOUDFLARE_API_TOKEN repository secret.'
            exit 1
          fi
          python3 tools/stage_cloudflare.py --release work/release --commit "$GITHUB_SHA" --preserve-custom-domains
          npx --yes wrangler@4.149.0 deploy --config work/cloudflare/wrangler.jsonc
      - name: Verify public commit, application hashes and dev log
        run: |
          python3 tools/verify_ci_deployment.py --release work/release --commit "$GITHUB_SHA" \
            --url https://furyremastered.com/
          python3 tools/verify_ci_deployment.py --release work/release --commit "$GITHUB_SHA" \
            --url https://atv-offroad-fury-2.champtoday.workers.dev/
      - name: Record deployment links and result
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Production deployment: $DEPLOYMENT_RESULT"
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "[Public HTTPS game](https://furyremastered.com/) · [Screenshot dev log](https://furyremastered.com/devlog.html)"
            echo ""
            echo "[GitHub deployment history](https://github.com/$GITHUB_REPOSITORY/deployments) · [This Actions run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
            echo "Success requires public commit identity, all authored application hashes, and committed dev-log text to match this run's checked artifact."
            echo "Runtime content and screenshot images are maintained separately in R2; full gameplay checks remain local/public browser checkpoints."
          } >> "$GITHUB_STEP_SUMMARY"
