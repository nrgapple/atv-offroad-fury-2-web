name: Desktop compile check

# Content-free: compiles and tests the desktop code on every desktop OS. The
# standalone archives (which embed game content) are built only on the owner's
# machine; see research/DESKTOP_RELEASES.md.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/build_android.py'
      - 'tools/build_desktop.py'
      - 'tools/build_engine.py'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    concurrency:
      group: desktop-check-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compile and link the desktop app (no content)
        run: cargo build --locked -p atv-app --bin fury
      - name: Test the content readers on this OS
        run: cargo test --locked -p atv-content
      - name: Compile with the embedded-content feature using a synthetic pack
        if: runner.os != 'Windows'
        run: |
          python3 tools/pack_content.py fixture "$RUNNER_TEMP/mini.pack"
          FURY_PACK="$RUNNER_TEMP/mini.pack" cargo test --locked -p atv-content --features embedded

  # Content-free Android compile: the engine library (cdylib, NativeActivity entry
  # point) for arm64 phones with the runner's preinstalled NDK. The signed APK is
  # built on the owner's machine only (tools/build_android.py, research/ANDROID.md).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: android-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup target add aarch64-linux-android
      - name: Compile the Android library (no content)
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          cargo clippy --locked -p atv-app --lib --target aarch64-linux-android -- -D warnings
          cargo rustc --locked -p atv-app --lib --crate-type cdylib --target aarch64-linux-android
          test -s target/aarch64-linux-android/debug/libatv_app.so

  # Content-free determinism: the simulation's maths (atv_core::math) and a
  # scripted synthetic ride must reproduce the browser build's bit patterns on
  # every desktop OS and CPU architecture. See research/RUST_ENGINE.md.
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    concurrency:
      group: determinism-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Bit-identical simulation (no content)
        run: cargo test --locked --release -p atv-core -- --exact math::tests::results_are_the_same_on_every_target vehicle::tests::synthetic_ride_is_the_same_on_every_target
