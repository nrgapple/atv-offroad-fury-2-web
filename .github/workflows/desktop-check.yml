name: Desktop compile check

# Content-free: compiles and tests the desktop code on every desktop OS. The
# standalone archives (which embed game content) are built only on the owner's
# machine; see research/DESKTOP_RELEASES.md.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    concurrency:
      group: desktop-check-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Compile the desktop app (no content)
        run: cargo check --locked -p atv-app --bin fury
      - name: Test the content readers on this OS
        run: cargo test --locked -p atv-content
      - name: Compile with the embedded-content feature using a synthetic pack
        if: runner.os != 'Windows'
        run: |
          python3 tools/pack_content.py fixture "$RUNNER_TEMP/mini.pack"
          FURY_PACK="$RUNNER_TEMP/mini.pack" cargo test --locked -p atv-content --features embedded
