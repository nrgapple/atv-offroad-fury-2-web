<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#140303">
  <title>Fury Remastered · Development log</title>
  <meta name="apple-mobile-web-app-title" content="Fury Dev Log">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/fury-remastered-home-192-v1.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/fury-remastered-home-180-v1.png">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="devlog.css">
  <script type="module" src="devlog.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="game-name" href="/"><img src="fury-remastered.svg" width="960" height="320" alt="Fury Remastered"></a>
    <h1>Dev Log</h1>
    <a class="game-link" href="/play.html">Play <span aria-hidden="true">▸</span></a>
  </header>
  <div id="main-anchor"></div>
  <nav class="tabs" role="tablist" aria-label="Development log sections">
    <button type="button" role="tab" id="tab-log" aria-controls="panel-log" aria-selected="true">Checkpoints <span id="count" class="tab-count"></span></button>
    <button type="button" role="tab" id="tab-board" aria-controls="port-status" aria-selected="false" tabindex="-1">Feature board <span id="board-count" class="tab-count"></span></button>
  </nav>
  <main>
    <section id="panel-log" role="tabpanel" aria-labelledby="tab-log">
      <div id="entries" class="entries"></div>
      <noscript>This log needs JavaScript. <a href="devlog.json">Read the checkpoint data.</a></noscript>
    </section>
    <section id="port-status" class="port-status" role="tabpanel" aria-labelledby="tab-board" hidden>
      <div class="port-status-heading">
        <h2 id="port-status-title">What is connected, and what is still missing</h2>
        <p id="port-status-note">Loading the current feature map…</p>
      </div>
      <div id="status-summary" class="status-summary" aria-label="Filter by status"></div>
      <details id="next-priorities" class="next-priorities" open>
        <summary>Next priorities</summary>
        <ol id="port-priorities"></ol>
      </details>
      <div class="status-filters" aria-label="Filter feature board">
        <label>Category
          <select id="feature-category"><option value="">All categories</option></select>
        </label>
        <label>Status
          <select id="feature-status">
            <option value="">All statuses</option>
            <option value="LIVE">Live</option>
            <option value="PARTIAL">Partial</option>
            <option value="RECOVERED NOT CONNECTED">Recovered, not connected</option>
            <option value="NEEDS RESEARCH">Needs research</option>
          </select>
        </label>
        <span id="feature-count" role="status" aria-live="polite"></span>
      </div>
      <div id="feature-board" class="feature-board" aria-live="polite"></div>
      <details class="port-release-box">
        <summary>Last fully verified public release</summary>
        <p id="port-release" class="port-release"></p>
      </details>
    </section>
  </main>
  <footer>Screenshots are captured from the build at each checkpoint. Older screenshots show earlier states. The port is not complete.</footer>
</body>
</html>
