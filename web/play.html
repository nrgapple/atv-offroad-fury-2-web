<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9c1414">
<title>Fury Remastered</title>
<meta name="apple-mobile-web-app-title" content="Fury Remastered">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/fury-remastered-home-192-v1.png" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/fury-remastered-home-180-v1.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="design-system.css">
<link rel="stylesheet" href="install.css">
<link rel="stylesheet" href="engine.css">
<script type="module" src="install.js"></script>
<script type="module" src="engine.js"></script>
</head>
<body>
<aside id="app-install-banner" aria-label="Save Fury Remastered as an app" hidden>
  <img src="/fury-remastered-home-180-v1.png" width="48" height="48" alt="">
  <div class="app-install-copy"><strong>Fury Remastered</strong><span>Your next ride, one tap away.</span></div>
  <button id="app-install-open" type="button" class="atv-control">Add app</button>
  <button id="app-install-dismiss" type="button" aria-label="Dismiss app banner">×</button>
</aside>
<dialog id="app-install-help" aria-labelledby="app-install-title" aria-describedby="app-install-description">
  <div class="app-install-heading"><img src="/fury-remastered-home-180-v1.png" width="56" height="56" alt=""><div><p>Fury Remastered</p><h2 id="app-install-title">Add to Home Screen</h2></div></div>
  <p id="app-install-description">Launch straight into the game from your Home Screen, with more room to ride.</p>
  <ol id="app-install-steps"></ol>
  <p class="app-install-note">Courses you have ridden in the app keep working offline; online play and the soundtrack need a connection.</p>
  <button id="app-install-close" type="button" class="atv-control">Got it</button>
</dialog>
<!-- The Rust frontend mirrors its page here (data-page; hidden while riding)
     for the install banner, which shows only on the title screen. -->
<div id="frontend" data-page="" hidden></div>
<canvas id="game" aria-label="Fury Remastered" tabindex="0"></canvas>
<div id="status">Starting Rust engine…</div>
<script type="module" src="offline.js"></script>
</body>
</html>
