<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07122a">
  <title>Fury Remastered</title>
  <meta name="apple-mobile-web-app-title" content="Fury Remastered">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="touch.css">
</head>
<body>
  <canvas id="game" aria-label="Original terrain and ATV reconstruction" tabindex="0"></canvas>
  <section id="frontend" aria-label="Game menu">
    <div id="menu-stage"><canvas id="menu-canvas" width="640" height="448" aria-hidden="true"></canvas><div id="menu-buttons"></div></div>
    <p id="menu-notice" role="status"></p>
  </section>
  <section id="loading-screen" class="loading-screen" aria-label="Loading game" aria-busy="true">
    <div class="loading-panel">
      <img class="loading-brand" src="fury-remastered.svg" width="960" height="320" alt="Fury Remastered">
      <h1 id="loading-title">Loading</h1>
      <p id="loading-detail" role="status">Preparing menus…</p>
      <div class="loading-meter" aria-hidden="true"></div>
    </div>
  </section>
  <div id="toolbar">
    <button id="menu" class="atv-control" type="button" aria-label="Pause"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h4v14H5zM12 3h4v14h-4z"/></svg><span>Pause</span></button>
    <button id="camera" class="atv-control" type="button" aria-label="Camera" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 3h8l2 3h2v11H2V6h2zm4 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg><span>Camera</span></button>
  </div>
  <div hidden>
    <input id="disc" type="file" accept=".iso,.tr2" hidden>
    <button id="fullscreen" type="button">Fullscreen</button>
    <button id="reset" type="button" disabled>Reset view</button>
  </div>
  <p id="status" role="status"></p>
  <p id="help" hidden>Free camera · drag to look · WASD to move · Q/E up/down · controller sticks or touch</p>
  <script type="module" src="game.js"></script>
</body>
</html>
