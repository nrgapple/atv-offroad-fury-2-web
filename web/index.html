<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07122a">
  <title>ATV Offroad Fury 2</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <canvas id="game" aria-label="Original terrain and ATV reconstruction" tabindex="0"></canvas>
  <section id="frontend" aria-label="Game menu">
    <div id="menu-stage"><canvas id="menu-canvas" width="640" height="448" aria-hidden="true"></canvas><div id="menu-buttons"></div></div>
    <p id="menu-notice" role="status">Loading original menus…</p>
  </section>
  <div id="toolbar">
    <button id="menu" type="button">Menu</button>
    <input id="disc" type="file" accept=".iso,.tr2" hidden>
    <button id="fullscreen" type="button">Fullscreen</button>
    <button id="reset" type="button" disabled>Reset view</button>
    <button id="camera" type="button" disabled>Camera</button>
    <a class="button" href="devlog.html">Dev log</a>
  </div>
  <p id="status" role="status">Loading original terrain…</p>
  <p id="help" hidden>Free camera · drag to look · WASD to move · Q/E up/down · controller sticks or touch</p>
  <script type="module" src="game.js"></script>
</body>
</html>
