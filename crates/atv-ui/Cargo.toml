[package]
name = "atv-ui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
atv-content = { path = "../atv-content" }
atv-core = { path = "../atv-core" }
atv-game = { path = "../atv-game" }
bytemuck = { version = "1", features = ["derive"] }
serde_json.workspace = true
web-time = "1"
taffy = { version = "0.15", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
swash = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "CanvasRenderingContext2d", "TextMetrics", "ImageData", "Path2d", "Storage", "CssStyleDeclaration", "MediaQueryList", "HtmlElement"] }

[dev-dependencies]
pollster = "0.4"
