[package]
name = "atv-app"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fury"
path = "src/main.rs"

[features]
# Desktop release builds: embed the content pack named by FURY_PACK.
embedded-content = ["atv-content/embedded"]

[dependencies]
atv-content = { path = "../atv-content" }
atv-core = { path = "../atv-core" }
atv-game = { path = "../atv-game" }
atv-render = { path = "../atv-render" }
atv-ui = { path = "../atv-ui" }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "metal", "dx12", "vulkan", "gles", "webgl"] }
cpal = { version = "0.18", features = ["wasm-bindgen"] }
gilrs = "0.11"
serde_json.workspace = true
web-time = "1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
png = "0.18"
pollster = "0.4"
# Desktop multiplayer relay client (WebSocket and the room POST), rustls.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Verifies downloaded content blobs (content_sync.rs, Android).
sha2 = "0.11"

# Desktop only: Android keeps the screen on through its activity window flag
# and has no clipboard backend in arboard (research/ANDROID.md).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
# Display-sleep inhibit while riding (wake.rs; the web uses the Wake Lock API).
keepawake = "0.6"
# Copy ride/invite links and paste into the Host/Join fields.
arboard = { version = "3", default-features = false }

# Android: winit's NativeActivity backend (no Java or Gradle), see
# research/ANDROID.md and src/android.rs.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-native-activity"] }
# stderr to logcat (android.rs).
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "Navigator", "Clipboard", "VisibilityState", "Element", "HtmlAudioElement", "HtmlCanvasElement", "WebGl2RenderingContext", "HtmlImageElement", "CanvasRenderingContext2d", "ImageData", "HtmlElement", "HtmlMediaElement", "Blob", "BlobPropertyBag", "Url", "Location", "console", "MediaQueryList", "CssStyleDeclaration", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Request", "RequestInit", "Response", "Headers", "HtmlInputElement", "KeyboardEvent", "Event", "EventTarget", "MediaError", "AddEventListenerOptions", "AudioContext", "AudioContextState", "BaseAudioContext", "AudioNode", "AudioParam", "GainNode", "BiquadFilterNode", "BiquadFilterType", "MediaElementAudioSourceNode", "AudioDestinationNode", "AnalyserNode"] }
