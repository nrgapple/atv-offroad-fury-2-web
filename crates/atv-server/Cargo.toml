[package]
name = "atv-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "fury-server: the multiplayer game server (research/GAME_SERVER.md)"

[[bin]]
name = "fury-server"
path = "src/main.rs"

[dependencies]
atv-net = { path = "../atv-net" }
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
# HMAC-SHA256 rider tokens and SHA-256 ids (already built for rustls).
ring = "0.17"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-acme = { version = "0.15", default-features = false, features = ["ring", "tls12", "webpki-roots", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "std"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
