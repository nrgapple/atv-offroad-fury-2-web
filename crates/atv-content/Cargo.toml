[package]
name = "atv-content"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# Compile the pack named by FURY_PACK (absolute path) into the binary. Release
# packaging only; normal and CI builds never enable it.
embedded = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
# 0.11 hashes with the CPU's SHA-256 instructions on arm64 too (Apple silicon), detected
# at run time: a bundled soundtrack song (5 MB) verifies in milliseconds.
sha2 = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Request", "RequestInit", "Response"] }
